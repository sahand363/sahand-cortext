name: Release

# Builds the pre-compiled binary on GitHub Actions whenever you push a tag:
#   git tag v1.0.0 && git push origin v1.0.0
# The installer / updater downloads this release — nothing is compiled
# on the Ubuntu server.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Vet and test
        run: |
          go vet ./...
          go test ./...

      - name: Build linux/amd64 binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o nokhodi-chat .

      - name: Package release
        run: |
          tar -czf nokhodi-chat-linux-amd64.tar.gz \
            nokhodi-chat manage.sh install.sh nokhodichat nokhodi-chat.service \
            config.example.json README.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: nokhodi-chat-linux-amd64.tar.gz
          generate_release_notes: true
