name: Build and validate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - name: Validate installer scripts
        run: |
          bash -n install.sh
          bash -n scripts/cortext-menu.sh
      - name: Build server
        run: |
          go mod tidy
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/sahand-cortext ./cmd/server
      - uses: actions/upload-artifact@v4
        with:
          name: sahand-cortext-linux-amd64
          path: dist/sahand-cortext
