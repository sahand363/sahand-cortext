name: Build and release
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true

      - name: Validate installer scripts
        run: |
          bash -n install.sh
          bash -n scripts/cortext-menu.sh

      - name: Download Go dependencies and generate checksums
        run: |
          go mod tidy

      - name: Run automated tests
        run: |
          go test -v ./...

      - name: Build server binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/sahand-cortext ./cmd/server

      - name: Publish pre-built release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest dist/sahand-cortext --title "Sahand-CorText (Latest)" --notes "Automated build from commit $GITHUB_SHA"
